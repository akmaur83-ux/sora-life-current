<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A2F" />
    <title>Sora Life — Modern Wellness, Beauty & Everyday Care</title>
    <meta name="description" content="Sora Life — premium health, wellness, beauty and personal-care essentials for modern living." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter widened to 800 for the Creator Program's display weights. Same
         existing font request — no new dependency, no extra connection. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E3A2F'/%3E%3Cpath d='M16 6c5 4 5 12 0 20-5-8-5-16 0-20z' fill='%23E8B04B'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/pages.css" />
    <link rel="stylesheet" href="/src/styles/pdp.css" />
    <link rel="stylesheet" href="/src/styles/home.css" />
    <link rel="stylesheet" href="/src/styles/promotions.css" />
    <link rel="stylesheet" href="/src/admin/admin.css" />
    <link rel="stylesheet" href="/src/styles/passport.css" />
    <link rel="stylesheet" href="/src/styles/creator.css" />
    <!-- Creator expressive layer. Loaded after creator.css so it layers on
         top rather than replacing it. Every token is scoped to .crp/.crob,
         so the storefront's calm palette is unaffected. -->
    <link rel="stylesheet" href="/src/styles/creator-expressive.css" />
    <!-- SORA LIFE V2 (Phase 1). Loaded last so V2 rules win on equal
         specificity without !important. Namespaced --slv2-* / v2-* so nothing
         outside the storefront can be affected. -->
    <link rel="stylesheet" href="/src/styles/v2-foundation.css" />
    <link rel="stylesheet" href="/src/styles/v2-header.css" />
    <link rel="stylesheet" href="/src/styles/v2-card.css" />
    <link rel="stylesheet" href="/src/styles/v2-home.css" />
    <link rel="stylesheet" href="/src/styles/v2-shop.css" />
    <link rel="stylesheet" href="/src/styles/v2-pdp.css" />
    <link rel="stylesheet" href="/src/styles/v2-cart-checkout.css" />
    <link rel="stylesheet" href="/src/styles/v2-mobile-cart.css" />
    <link rel="stylesheet" href="/src/styles/homepage-appearance.css" />
    <link rel="stylesheet" href="/src/styles/hero-cta.css" />
    <!-- Homepage marketplace layer is intentionally last and scoped to
         .v2-home so Admin-configured visuals remain inputs while the modern
         commerce composition wins over the legacy Home shell. -->
    <link rel="stylesheet" href="/src/styles/v2-home-marketplace.css" />
    <link rel="stylesheet" href="/src/styles/v2-home-discovery.css" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#FBF8F1;font-family:'Fraunces',Georgia,serif;color:#1E3A2F;">
        <div style="text-align:center;">
          <div style="width:34px;height:34px;margin:0 auto 14px;border:2.5px solid #E1EEE7;border-top-color:#1E3A2F;border-radius:999px;animation:sl-spin 0.8s linear infinite;"></div>
          <span style="font-size:0.95rem;letter-spacing:0.04em;">SORA LIFE</span>
        </div>
      </div>
    </div>
    <style>@keyframes sl-spin{to{transform:rotate(360deg)}}</style>
    <script src="/public/bundle.js"></script>
  </body>
</html>
