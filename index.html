<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A2F" />
    <title>Sora Life — Modern Wellness, Beauty & Everyday Care</title>
    <meta name="description" content="Sora Life — premium health, wellness, beauty and personal-care essentials for modern living." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter widened to 800 for the Creator Program's display weights. Same
         existing font request — no new dependency, no extra connection.
         Fraunces' opsz/SOFT/WONK axes are PINNED to the single values the
         CSS actually sets everywhere (opsz 144, SOFT 0, WONK 0). Requesting
         their full ranges shipped ~163 KB of axis data no rule ever used. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@144,300..700,0,0&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E3A2F'/%3E%3Cpath d='M16 6c5 4 5 12 0 20-5-8-5-16 0-20z' fill='%23E8B04B'/%3E%3C/svg%3E" />
    <!-- One render-blocking stylesheet, generated by scripts/build-css.mjs
         from the 25 storefront sources in cascade order. It used to be 30
         separate <link>s: 30 blocking requests before first paint, and 30
         re-validations on every repeat visit because the assets are unhashed
         and served must-revalidate. Admin / passport / creator styles are no
         longer here at all — src/main.jsx injects app-deferred.css after
         paint. Edit the sources in src/styles, then `npm run build`. -->
    <link rel="stylesheet" href="/public/app.css" />
    <!-- The app entry, preloaded here so its download starts alongside the
         stylesheet rather than after it — most of the gap between first paint
         and interactive on a throttled connection. modulepreload rather than
         preload because the entry is an ES module now: admin routes are split
         into /public/chunks/ and only fetched when someone opens /admin. -->
    <link rel="modulepreload" href="/public/bundle.js" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#FBF8F1;font-family:'Fraunces',Georgia,serif;color:#1E3A2F;">
        <div style="text-align:center;">
          <div style="width:34px;height:34px;margin:0 auto 14px;border:2.5px solid #E1EEE7;border-top-color:#1E3A2F;border-radius:999px;animation:sl-spin 0.8s linear infinite;"></div>
          <span style="font-size:0.95rem;letter-spacing:0.04em;">SORA LIFE</span>
        </div>
      </div>
    </div>
    <style>@keyframes sl-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/public/bundle.js"></script>
  </body>
</html>
