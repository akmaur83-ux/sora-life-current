<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A2F" />
    <title>SORA LIFESTYLE — Fashion, Home & Living, Wellness & Beauty</title>
    <meta name="description" content="Fashion, leather, shawls, home &amp; living, wellness and beauty from trusted Indian brands, in one place. Cash on delivery available." />
    <!-- The link card (owner, 2026-11-20): a link pasted into WhatsApp, Instagram or Facebook
         used to show the old berry favicon and the old wellness-only title. Product pages
         replace these with their own (api/_lib/share.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SORA LIFESTYLE" />
    <meta property="og:title" content="SORA LIFESTYLE — Fashion, Home &amp; Living, Wellness &amp; Beauty" />
    <meta property="og:description" content="Fashion, leather, shawls, home &amp; living, wellness and beauty from trusted Indian brands, in one place. Cash on delivery available." />
    <meta property="og:image" content="https://www.soralifestyle.in/assets/sora-share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SORA LIFESTYLE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.soralifestyle.in/assets/sora-share-card.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter widened to 800 for the Creator Program's display weights. Same
         existing font request — no new dependency, no extra connection.
         Playfair Display is the display face (wght 400..700 is every weight
         a rule sets); it replaced Fraunces, whose opsz/SOFT/WONK axes are gone
         with it. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..700&family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The installed app (2026-11-13): iPhone home-screen app name and status bar; Android reads the manifest. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SORA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="SORA LIFESTYLE" />
    <!-- One render-blocking stylesheet, generated by scripts/build-css.mjs
         from the 25 storefront sources in cascade order. It used to be 30
         separate <link>s: 30 blocking requests before first paint, and 30
         re-validations on every repeat visit because the assets are unhashed
         and served must-revalidate. Admin / passport / creator styles are no
         longer here at all — src/main.jsx injects app-deferred.css after
         paint. Edit the sources in src/styles, then `npm run build`. -->
    <link rel="stylesheet" href="/public/app.css" />
    <!-- The app entry, preloaded here so its download starts alongside the
         stylesheet rather than after it — most of the gap between first paint
         and interactive on a throttled connection. modulepreload rather than
         preload because the entry is an ES module now: admin routes are split
         into /public/chunks/ and only fetched when someone opens /admin. -->
    <link rel="modulepreload" href="/public/bundle.js" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#FBF8F1;font-family:'Playfair Display',Georgia,serif;color:#1E3A2F;">
        <div style="text-align:center;">
          <div style="width:34px;height:34px;margin:0 auto 14px;border:2.5px solid #E1EEE7;border-top-color:#1E3A2F;border-radius:999px;animation:sl-spin 0.8s linear infinite;"></div>
          <span style="font-size:0.95rem;letter-spacing:0.04em;">SORA LIFESTYLE</span>
        </div>
      </div>
    </div>
    <style>@keyframes sl-spin{to{transform:rotate(360deg)}}</style>
    <!-- The published storefront content, written here by build/publish-content.mjs on every deploy. -->
    <!--sora-content-->
    <script type="module" src="/public/bundle.js"></script>
  </body>
</html>
